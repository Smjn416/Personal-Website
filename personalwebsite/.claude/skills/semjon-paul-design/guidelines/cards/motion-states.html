<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>html,body{background:var(--bg-page)}body{margin:0;padding:22px 26px;display:flex;align-items:center}.w{width:100%}.sw{display:flex;gap:0;border-radius:var(--radius-md);overflow:hidden;box-shadow:var(--highlight-ring)}.sw>div{flex:1;height:64px;display:flex;align-items:flex-end;padding:7px 8px}.sw span{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.04em;line-height:1.15}.row{display:flex;gap:14px;align-items:center;flex-wrap:wrap}.lb{font-family:var(--font-mono);font-size:var(--text-label);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--text-faint)}.mono{font-family:var(--font-mono);font-size:10.5px;color:var(--text-dim);letter-spacing:.03em}</style></head><body><div class="w"><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px"><div style="text-align:center"><div style="height:48px;border-radius:var(--radius-pill);display:flex;align-items:center;justify-content:center;box-shadow:var(--highlight-ring);color:var(--text-strong);font-size:var(--text-sm);background:var(--ink-700);transform:none">Label</div><div class="mono" style="margin-top:7px;font-size:9px">Rest</div></div><div style="text-align:center"><div style="height:48px;border-radius:var(--radius-pill);display:flex;align-items:center;justify-content:center;box-shadow:var(--highlight-ring);color:var(--text-strong);font-size:var(--text-sm);background:var(--ink-600);transform:translateY(-2px);box-shadow:var(--shadow-md)">Label</div><div class="mono" style="margin-top:7px;font-size:9px">Hover</div></div><div style="text-align:center"><div style="height:48px;border-radius:var(--radius-pill);display:flex;align-items:center;justify-content:center;box-shadow:var(--highlight-ring);color:var(--text-strong);font-size:var(--text-sm);background:var(--ink-600);transform:scale(0.985)">Label</div><div class="mono" style="margin-top:7px;font-size:9px">Press</div></div><div style="text-align:center"><div style="height:48px;border-radius:var(--radius-pill);display:flex;align-items:center;justify-content:center;box-shadow:var(--highlight-ring);color:var(--text-strong);font-size:var(--text-sm);background:var(--ink-700);outline:2px solid var(--focus-ring);outline-offset:2px">Label</div><div class="mono" style="margin-top:7px;font-size:9px">Focus</div></div></div>
