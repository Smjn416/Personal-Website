<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>html,body{background:var(--bg-page)}body{margin:0;padding:22px 26px;display:flex;align-items:center}.w{width:100%}.sw{display:flex;gap:0;border-radius:var(--radius-md);overflow:hidden;box-shadow:var(--highlight-ring)}.sw>div{flex:1;height:64px;display:flex;align-items:flex-end;padding:7px 8px}.sw span{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.04em;line-height:1.15}.row{display:flex;gap:14px;align-items:center;flex-wrap:wrap}.mono{font-family:var(--font-mono);font-size:10.5px;color:var(--text-dim);letter-spacing:.03em}</style></head><body><div class="w"><div class="sw"><div style="background:var(--paper-100)"><span style="color:var(--ink-950)">100</span></div><div style="background:var(--paper-200)"><span style="color:var(--ink-950)">200</span></div><div style="background:var(--paper-300)"><span style="color:var(--ink-950)">300</span></div><div style="background:var(--paper-400)"><span style="color:var(--ink-950)">400</span></div><div style="background:var(--paper-500)"><span style="color:var(--ink-990)">500</span></div><div style="background:var(--paper-600)"><span style="color:var(--paper-100)">600</span></div><div style="background:var(--paper-700)"><span style="color:var(--paper-100)">700</span></div></div><div class="mono" style="margin-top:10px">100 strong · 300 body · 500 dim · 700 faint</div></div></body></html>
