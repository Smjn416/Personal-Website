<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>html,body{background:var(--bg-page)}body{margin:0;padding:22px 26px;display:flex;align-items:center}.w{width:100%}.sw{display:flex;gap:0;border-radius:var(--radius-md);overflow:hidden;box-shadow:var(--highlight-ring)}.sw>div{flex:1;height:64px;display:flex;align-items:flex-end;padding:7px 8px}.sw span{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.04em;line-height:1.15}.row{display:flex;gap:14px;align-items:center;flex-wrap:wrap}.lb{font-family:var(--font-mono);font-size:var(--text-label);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--text-faint)}.mono{font-family:var(--font-mono);font-size:10.5px;color:var(--text-dim);letter-spacing:.03em}</style></head><body><div class="w"><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px 24px" class="mono"><div><span style="color:var(--text-body)">--leading-display</span> <span style="color:var(--text-faint)">0.92 — display only</span></div><div><span style="color:var(--text-body)">--tracking-display</span> <span style="color:var(--text-faint)">-0.035em</span></div><div><span style="color:var(--text-body)">--leading-tight</span> <span style="color:var(--text-faint)">1.08 — headings</span></div><div><span style="color:var(--text-body)">--tracking-heading</span> <span style="color:var(--text-faint)">-0.02em</span></div><div><span style="color:var(--text-body)">--leading-snug</span> <span style="color:var(--text-faint)">1.25 — lead-ins</span></div><div><span style="color:var(--text-body)">--tracking-body</span> <span style="color:var(--text-faint)">-0.005em</span></div><div><span style="color:var(--text-body)">--leading-body</span> <span style="color:var(--text-faint)">1.6 — paragraphs</span></div><div><span style="color:var(--text-body)">--tracking-label</span> <span style="color:var(--text-faint)">0.18em</span></div><div><span style="color:var(--text-body)">--leading-loose</span> <span style="color:var(--text-faint)">1.75 — captions</span></div><div><span style="color:var(--text-body)">--tracking-mono</span> <span style="color:var(--text-faint)">0.02em</span></div></div></div></body></html>
