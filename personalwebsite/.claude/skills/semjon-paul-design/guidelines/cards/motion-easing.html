<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>html,body{background:var(--bg-page)}body{margin:0;padding:22px 26px;display:flex;align-items:center}.w{width:100%}.sw{display:flex;gap:0;border-radius:var(--radius-md);overflow:hidden;box-shadow:var(--highlight-ring)}.sw>div{flex:1;height:64px;display:flex;align-items:flex-end;padding:7px 8px}.sw span{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.04em;line-height:1.15}.row{display:flex;gap:14px;align-items:center;flex-wrap:wrap}.lb{font-family:var(--font-mono);font-size:var(--text-label);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--text-faint)}.mono{font-family:var(--font-mono);font-size:10.5px;color:var(--text-dim);letter-spacing:.03em}</style></head><body><div class="w"><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:18px"><div><svg viewBox="0 0 60 56" style="width:100%;height:52px"><path d="M0 56 C 39 56 21 0 60 0" fill="none" stroke="var(--accent)" stroke-width="2"/></svg><div class="mono" style="margin-top:6px;color:var(--text-body)">--ease-glide</div><div class="mono" style="font-size:9px">cubic-bezier(0.65,0,0.35,1)</div><div class="mono" style="font-size:9px;color:var(--text-faint)">GSAP power2.inOut</div></div><div><svg viewBox="0 0 60 56" style="width:100%;height:52px"><path d="M0 56 C 13 0 30 0 60 0" fill="none" stroke="var(--accent)" stroke-width="2"/></svg><div class="mono" style="margin-top:6px;color:var(--text-body)">--ease-out</div><div class="mono" style="font-size:9px">cubic-bezier(0.22,1,0.36,1)</div><div class="mono" style="font-size:9px;color:var(--text-faint)">GSAP power3.out</div></div><div><svg viewBox="0 0 60 56" style="width:100%;height:52px"><path d="M0 56 C 33 56 60 33 60 0" fill="none" stroke="var(--accent)" stroke-width="2"/></svg><div class="mono" style="margin-top:6px;color:var(--text-body)">--ease-in</div><div class="mono" style="font-size:9px">cubic-bezier(0.55,0,1,0.45)</div><div class="mono" style="font-size:9px;color:var(--text-faint)">GSAP power2.in</div></div></div></div></body></html>
