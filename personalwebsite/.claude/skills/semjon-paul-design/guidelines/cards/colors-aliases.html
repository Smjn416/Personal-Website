<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>html,body{background:var(--bg-page)}body{margin:0;padding:22px 26px;display:flex;align-items:center}.w{width:100%}.sw{display:flex;gap:0;border-radius:var(--radius-md);overflow:hidden;box-shadow:var(--highlight-ring)}.sw>div{flex:1;height:64px;display:flex;align-items:flex-end;padding:7px 8px}.sw span{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.04em;line-height:1.15}.row{display:flex;gap:14px;align-items:center;flex-wrap:wrap}.lb{font-family:var(--font-mono);font-size:var(--text-label);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--text-faint)}.mono{font-family:var(--font-mono);font-size:10.5px;color:var(--text-dim);letter-spacing:.03em}</style></head><body><div class="w"><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px"><div style="border-radius:var(--radius-sm);overflow:hidden;box-shadow:var(--highlight-ring)"><div style="height:26px;background:var(--text-strong)"></div><div class="mono" style="padding:5px 6px;font-size:9px">--text-strong</div></div><div style="border-radius:var(--radius-sm);overflow:hidden;box-shadow:var(--highlight-ring)"><div style="height:26px;background:var(--text-body)"></div><div class="mono" style="padding:5px 6px;font-size:9px">--text-body</div></div><div style="border-radius:var(--radius-sm);overflow:hidden;box-shadow:var(--highlight-ring)"><div style="height:26px;background:var(--text-dim)"></div><div class="mono" style="padding:5px 6px;font-size:9px">--text-dim</div></div><div style="border-radius:var(--radius-sm);overflow:hidden;box-shadow:var(--highlight-ring)"><div style="height:26px;background:var(--text-accent)"></div><div class="mono" style="padding:5px 6px;font-size:9px">--text-accent</div></div><div style="border-radius:var(--radius-sm);overflow:hidden;box-shadow:var(--highlight-ring)"><div style="height:26px;background:var(--bg-page)"></div><div class="mono" style="padding:5px 6px;font-size:9px">--bg-page</div></div><div style="border-radius:var(--radius-sm);overflow:hidden;box-shadow:var(--highlight-ring)"><div style="height:26px;background:var(--bg-raised)"></div><div class="mono" style="padding:5px 6px;font-size:9px">--bg-raised</div></div><div style="border-radius:var(--radius-sm);overflow:hidden;box-shadow:var(--highlight-ring)"><div style="height:26px;background:var(--surface-inset)"></div><div class="mono" style="padding:5px 6px;font-size:9px">--surface-inset</div></div><div style="border-radius:var(--radius-sm);overflow:hidden;box-shadow:var(--highlight-ring)"><div style="height:26px;background:var(--accent-wash)"></div><div class="mono" style="padding:5px 6px;font-size:9px">--accent-wash</div></div><div style="border-radius:var(--radius-sm);overflow:hidden;box-shadow:var(--highlight-ring)"><div style="height:26px;background:var(--border-hairline)"></div><div class="mono" style="padding:5px 6px;font-size:9px">--border-hairline</div></div><div style="border-radius:var(--radius-sm);overflow:hidden;box-shadow:var(--highlight-ring)"><div style="height:26px;background:var(--border-soft)"></div><div class="mono" style="padding:5px 6px;font-size:9px">--border-soft</div></div><div style="border-radius:var(--radius-sm);overflow:hidden;box-shadow:var(--highlight-ring)"><div style="height:26px;background:var(--border-strong)"></div><div class="mono" style="padding:5px 6px;font-size:9px">--border-strong</div></div><div style="border-radius:var(--radius-sm);overflow:hidden;box-shadow:var(--highlight-ring)"><div style="height:26px;background:var(--border-accent)"></div><div class="mono" style="padding:5px 6px;font-size:9px">--border-accent</div></div></div></div></body></html>
