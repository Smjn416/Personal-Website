<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>html,body{background:var(--bg-page)}body{margin:0;padding:22px 26px;display:flex;align-items:center}.w{width:100%}.sw{display:flex;gap:0;border-radius:var(--radius-md);overflow:hidden;box-shadow:var(--highlight-ring)}.sw>div{flex:1;height:64px;display:flex;align-items:flex-end;padding:7px 8px}.sw span{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.04em;line-height:1.15}.row{display:flex;gap:14px;align-items:center;flex-wrap:wrap}.lb{font-family:var(--font-mono);font-size:var(--text-label);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--text-faint)}.mono{font-family:var(--font-mono);font-size:10.5px;color:var(--text-dim);letter-spacing:.03em}</style></head><body><div class="w"><div style="display:flex;gap:12px;align-items:flex-end"><div style="flex:1"><div style="height:34px;border-radius:var(--radius-sm);background:var(--accent-wash);box-shadow:inset 0 0 0 1px var(--border-accent);opacity:0.25"></div><div class="mono" style="margin-top:6px;font-size:9px">+0.00s</div></div><div style="flex:1"><div style="height:56px;border-radius:var(--radius-sm);background:var(--accent-wash);box-shadow:inset 0 0 0 1px var(--border-accent);opacity:0.5"></div><div class="mono" style="margin-top:6px;font-size:9px">+0.07s</div></div><div style="flex:1"><div style="height:78px;border-radius:var(--radius-sm);background:var(--accent-wash);box-shadow:inset 0 0 0 1px var(--border-accent);opacity:0.75"></div><div class="mono" style="margin-top:6px;font-size:9px">+0.14s</div></div><div style="flex:1"><div style="height:100px;border-radius:var(--radius-sm);background:var(--accent-wash);box-shadow:inset 0 0 0 1px var(--border-accent);opacity:1"></div><div class="mono" style="margin-top:6px;font-size:9px">+0.21s</div></div></div>
<div class="mono" style="margin-top:12px">y: --reveal-distance 2.5rem → 0, opacity 0 → 1, --dur-reveal, --ease-out, stagger --stagger-base. Never animate width/height/top/left.</div></div></body></html>
