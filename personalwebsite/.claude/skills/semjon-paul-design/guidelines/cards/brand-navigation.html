<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>html,body{background:var(--bg-page)}body{margin:0;padding:22px 26px;display:flex;align-items:center}.w{width:100%}.sw{display:flex;gap:0;border-radius:var(--radius-md);overflow:hidden;box-shadow:var(--highlight-ring)}.sw>div{flex:1;height:64px;display:flex;align-items:flex-end;padding:7px 8px}.sw span{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.04em;line-height:1.15}.row{display:flex;gap:14px;align-items:center;flex-wrap:wrap}.mono{font-family:var(--font-mono);font-size:10.5px;color:var(--text-dim);letter-spacing:.03em}</style></head><body><div class="w"><div style="position:relative;height:180px;border-radius:var(--radius-lg);background:var(--gradient-scene);box-shadow:var(--highlight-ring);overflow:hidden">
<div style="position:absolute;top:18px;left:20px;font-size:1.0625rem;font-weight:var(--weight-medium);letter-spacing:-0.02em;color:var(--text-strong)">Semjon&nbsp;Paul</div>
<div style="position:absolute;top:50%;right:20px;transform:translateY(-50%);display:flex;flex-direction:column;align-items:flex-end;gap:16px">
<div style="display:flex;align-items:center;gap:10px;font-family:var(--font-mono);font-size:var(--text-label);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--accent)"><span style="display:inline-block;width:28px;height:1px;background:currentColor"></span>Work</div><div style="display:flex;align-items:center;gap:10px;font-family:var(--font-mono);font-size:var(--text-label);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--text-faint)"><span style="display:inline-block;width:12px;height:1px;background:currentColor"></span>About</div><div style="display:flex;align-items:center;gap:10px;font-family:var(--font-mono);font-size:var(--text-label);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--text-faint)"><span style="display:inline-block;width:12px;height:1px;background:currentColor"></span>Contact</div>
</div>
<div style="position:absolute;bottom:18px;left:20px;display:flex;align-items:center;gap:10px;font-family:var(--font-mono);font-size:var(--text-label);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--text-dim)"><span style="width:6px;height:6px;border-radius:50%;background:var(--verdigris-300)"></span>Available for work</div>
</div>
<div class="mono" style="margin-top:10px;color:var(--text-faint)">No bar, no panel, no backdrop — three fixed text elements on the scene. The active rule grows from 12px to 28px.</div></div></body></html>
