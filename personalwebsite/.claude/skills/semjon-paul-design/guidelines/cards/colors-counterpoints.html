<!-- @dsCard group="Colors" viewport="700x170" name="Counterpoints" subtitle="Verdigris cools the red; Sand quiets it" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>html,body{background:var(--bg-page)}body{margin:0;padding:22px 26px;display:flex;align-items:center}.w{width:100%}.sw{display:flex;gap:0;border-radius:var(--radius-md);overflow:hidden;box-shadow:var(--highlight-ring)}.sw>div{flex:1;height:64px;display:flex;align-items:flex-end;padding:7px 8px}.sw span{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.04em;line-height:1.15}.row{display:flex;gap:14px;align-items:center;flex-wrap:wrap}.mono{font-family:var(--font-mono);font-size:10.5px;color:var(--text-dim);letter-spacing:.03em}</style></head><body><div class="w"><div class="row" style="gap:18px">
<div style="flex:1"><div class="sw"><div style="background:var(--verdigris-200)"><span style="color:var(--ink-950)">200</span></div><div style="background:var(--verdigris-300)"><span style="color:var(--ink-990)">300</span></div><div style="background:var(--verdigris-400)"><span style="color:var(--paper-100)">400</span></div></div><div class="mono" style="margin-top:8px">Verdigris — #4e9e9e</div></div>
<div style="flex:1"><div class="sw"><div style="background:var(--sand-200)"><span style="color:var(--ink-950)">200</span></div><div style="background:var(--sand-300)"><span style="color:var(--ink-950)">300</span></div></div><div class="mono" style="margin-top:8px">Sand — #c9a882</div></div>
</div>
<div class="mono" style="margin-top:10px;color:var(--text-faint)">Neither is ever interactive. Verdigris: status dots, info, one data accent. Sand: figure numerals, large quiet areas. Max one of each per viewport.</div></div></body></html>
