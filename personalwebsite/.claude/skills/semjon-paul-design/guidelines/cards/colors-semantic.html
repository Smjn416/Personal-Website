<!-- @dsCard group="Colors" viewport="700x170" name="Semantic signals" subtitle="Form and system feedback only" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>html,body{background:var(--bg-page)}body{margin:0;padding:22px 26px;display:flex;align-items:center}.w{width:100%}.sw{display:flex;gap:0;border-radius:var(--radius-md);overflow:hidden;box-shadow:var(--highlight-ring)}.sw>div{flex:1;height:64px;display:flex;align-items:flex-end;padding:7px 8px}.sw span{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.04em;line-height:1.15}.row{display:flex;gap:14px;align-items:center;flex-wrap:wrap}.mono{font-family:var(--font-mono);font-size:10.5px;color:var(--text-dim);letter-spacing:.03em}</style></head><body><div class="w"><div class="sw"><div style="background:var(--signal-positive)"><span style="color:var(--ink-950)">positive</span></div><div style="background:var(--signal-warning)"><span style="color:var(--ink-950)">warning</span></div><div style="background:var(--signal-danger)"><span style="color:var(--ink-950)">danger</span></div></div><div class="mono" style="margin-top:10px">#6fbf8f · #e5b045 · #ff4d6d</div>
<div class="mono" style="margin-top:6px;color:var(--text-faint)">Danger is crimson-pink, not the brand red, so an error never reads as an accent. Errors always carry a message and an icon — hue is never the only cue.</div></div></body></html>
