<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>html,body{background:var(--bg-page)}body{margin:0;padding:22px 26px;display:flex;align-items:center}.w{width:100%}.sw{display:flex;gap:0;border-radius:var(--radius-md);overflow:hidden;box-shadow:var(--highlight-ring)}.sw>div{flex:1;height:64px;display:flex;align-items:flex-end;padding:7px 8px}.sw span{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.04em;line-height:1.15}.row{display:flex;gap:14px;align-items:center;flex-wrap:wrap}.lb{font-family:var(--font-mono);font-size:var(--text-label);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--text-faint)}.mono{font-family:var(--font-mono);font-size:10.5px;color:var(--text-dim);letter-spacing:.03em}</style></head><body><div class="w"><div style="display:flex;align-items:flex-end;gap:7px"><div style="text-align:center"><div style="width:0.25rem;height:0.25rem;min-width:4px;background:var(--accent-wash);box-shadow:inset 0 0 0 1px var(--border-accent);border-radius:2px"></div><div class="mono" style="margin-top:5px;font-size:9px">1</div></div><div style="text-align:center"><div style="width:0.5rem;height:0.5rem;min-width:4px;background:var(--accent-wash);box-shadow:inset 0 0 0 1px var(--border-accent);border-radius:2px"></div><div class="mono" style="margin-top:5px;font-size:9px">2</div></div><div style="text-align:center"><div style="width:0.75rem;height:0.75rem;min-width:4px;background:var(--accent-wash);box-shadow:inset 0 0 0 1px var(--border-accent);border-radius:2px"></div><div class="mono" style="margin-top:5px;font-size:9px">3</div></div><div style="text-align:center"><div style="width:1rem;height:1rem;min-width:4px;background:var(--accent-wash);box-shadow:inset 0 0 0 1px var(--border-accent);border-radius:2px"></div><div class="mono" style="margin-top:5px;font-size:9px">4</div></div><div style="text-align:center"><div style="width:1.25rem;height:1.25rem;min-width:4px;background:var(--accent-wash);box-shadow:inset 0 0 0 1px var(--border-accent);border-radius:2px"></div><div class="mono" style="margin-top:5px;font-size:9px">5</div></div><div style="text-align:center"><div style="width:1.5rem;height:1.5rem;min-width:4px;background:var(--accent-wash);box-shadow:inset 0 0 0 1px var(--border-accent);border-radius:2px"></div><div class="mono" style="margin-top:5px;font-size:9px">6</div></div><div style="text-align:center"><div style="width:2rem;height:2rem;min-width:4px;background:var(--accent-wash);box-shadow:inset 0 0 0 1px var(--border-accent);border-radius:2px"></div><div class="mono" style="margin-top:5px;font-size:9px">8</div></div><div style="text-align:center"><div style="width:2.5rem;height:2.5rem;min-width:4px;background:var(--accent-wash);box-shadow:inset 0 0 0 1px var(--border-accent);border-radius:2px"></div><div class="mono" style="margin-top:5px;font-size:9px">10</div></div><div style="text-align:center"><div style="width:3rem;height:3rem;min-width:4px;background:var(--accent-wash);box-shadow:inset 0 0 0 1px var(--border-accent);border-radius:2px"></div><div class="mono" style="margin-top:5px;font-size:9px">12</div></div><div style="text-align:center"><div style="width:4rem;height:4rem;min-width:4px;background:var(--accent-wash);box-shadow:inset 0 0 0 1px var(--border-accent);border-radius:2px"></div><div class="mono" style="margin-top:5px;font-size:9px">16</div></div><div style="text-align:center"><div style="width:5rem;height:5rem;min-width:4px;background:var(--accent-wash);box-shadow:inset 0 0 0 1px var(--border-accent);border-radius:2px"></div><div class="mono" style="margin-top:5px;font-size:9px">20</div></div><div style="text-align:center"><div style="width:6rem;height:6rem;min-width:4px;background:var(--accent-wash);box-shadow:inset 0 0 0 1px var(--border-accent);border-radius:2px"></div><div class="mono" style="margin-top:5px;font-size:9px">24</div></div></div></div></body></html>
